services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: [.env]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on:
      redis: {condition: service_healthy}

  worker:
    build: .
    command: celery -A ikart worker -l info -Q ikart --concurrency=4
    env_file: [.env]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes: [".:/app"]
    depends_on:
      redis: {condition: service_healthy}

  beat:
    build: .
    command: celery -A ikart beat -l info --schedule /tmp/celerybeat-schedule
    env_file: [.env]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes: [".:/app"]
    depends_on:
      redis: {condition: service_healthy}

volumes:
  redis-data:
