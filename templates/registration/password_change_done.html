{% extends 'storefront/auth_base.html' %}{% load storefront_extras %}

{% block title %}Password changed | IKart{% endblock %}

{% block auth_content %}
    <span class="ik-auth-icon ik-auth-icon-ok">{% icon 'check' 28 %}</span>
    <h1 class="ik-h1">Password changed</h1>
    <p class="ik-sub">Your password has been updated successfully.</p>
    <a href="{% url 'storefront:account' %}" class="ik-btn ik-btn-primary ik-btn-block">Back to my account</a>
{% endblock %}
