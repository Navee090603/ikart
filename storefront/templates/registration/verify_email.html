{% extends 'storefront/base.html' %}{% block title %}Verify your email | IKart{% endblock %}{% block content %}<div class="max-w-md mx-auto px-4 py-10"><div class="bg-white rounded-xl p-6 space-y-4"><h1 class="text-2xl font-bold">Verify your email</h1><p class="text-slate-600">We sent a six-digit code to <strong>{{ email }}</strong>. It expires in 10 minutes.</p><form method="post" class="space-y-4">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-full">Verify account</button></form><form method="post" action="{% url 'storefront:resend_verification_code' %}">{% csrf_token %}<button class="text-amber-700 text-sm">Resend verification code</button></form></div></div>{% endblock %}
