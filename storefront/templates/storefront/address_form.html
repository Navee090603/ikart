{% extends 'storefront/account_base.html' %}{% load storefront_extras %}
{% block title %}Edit address | IKart{% endblock %}
{% block account_content %}
<a class="ik-link text-sm inline-flex items-center gap-1 self-start" href="{% url 'storefront:addresses' %}">{% icon 'chevron-left' 16 %}Saved addresses</a>
<form method="post" class="ik-panel ik-form max-w-xl">
  {% csrf_token %}
  <h1 class="ik-h1 mb-5">Edit address</h1>
  {{ form.as_p }}
  <div class="flex gap-2">
    <button class="ik-btn ik-btn-primary">Save changes</button>
    <a class="ik-btn ik-btn-ghost" href="{% url 'storefront:addresses' %}">Cancel</a>
  </div>
</form>
{% endblock %}
