{% extends 'storefront/base.html' %}
{% block title %}Secure payment | IKart{% endblock %}
{% block content %}<div class="max-w-xl mx-auto px-4 py-12"><div class="bg-white rounded-xl p-7 text-center"><h1 class="text-2xl font-bold">Complete secure payment</h1><p class="text-slate-600 mt-3">Order {{ order.number }} · ₹{{ order.total }}</p><button id="pay-button" class="btn btn-primary mt-6">Pay ₹{{ order.total }} securely</button><form id="success-form" method="post" action="{% url 'storefront:verify_razorpay_payment' order.number %}" class="hidden">{% csrf_token %}<input name="razorpay_payment_id"><input name="razorpay_order_id"><input name="razorpay_signature"></form><form id="cancel-form" method="post" action="{% url 'storefront:cancel_razorpay_payment' order.number %}" class="mt-4">{% csrf_token %}<button class="text-sm text-slate-600">Cancel payment</button></form></div></div><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>let succeeded=false;const options={key:'{{ razorpay_key_id|escapejs }}',amount:'{{ amount_paise }}',currency:'{{ payment.currency }}',name:'IKart',description:'Order {{ order.number }}',order_id:'{{ payment.provider_order_id }}',prefill:{name:'{{ order.full_name|escapejs }}',email:'{{ order.email|escapejs }}',contact:'{{ order.phone|escapejs }}'},handler:r=>{succeeded=true;const f=document.getElementById('success-form');f.razorpay_payment_id.value=r.razorpay_payment_id;f.razorpay_order_id.value=r.razorpay_order_id;f.razorpay_signature.value=r.razorpay_signature;f.submit()},modal:{ondismiss:()=>{if(!succeeded)document.getElementById('cancel-form').submit()}},theme:{color:'#f59e0b'}};const rzp=new Razorpay(options);rzp.on('payment.failed',()=>{if(!succeeded)document.getElementById('cancel-form').submit()});document.getElementById('pay-button').onclick=e=>{e.preventDefault();rzp.open()};</script>{% endblock %}
