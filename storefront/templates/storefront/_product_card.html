<a href="{{ product.get_absolute_url }}" class="bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-md block"><div class="bg-slate-100">{% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }}" class="product-image w-full">{% else %}<div class="product-image grid place-items-center text-slate-400">No image</div>{% endif %}</div><div class="p-4"><div class="font-semibold line-clamp-2">{{ product.name }}</div><div class="text-sm mt-1"><span class="star">★</span> {{ product.average_rating }}</div><div class="font-bold text-lg mt-1">₹{{ product.price }}</div></div></a>
